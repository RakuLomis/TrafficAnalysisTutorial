<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>加密流量课堂 · 教师端</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%232563eb'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div>
          <p class="eyebrow">本机受保护入口</p>
          <h1>加密流量课堂</h1>
        </div>
        <div class="topbar-right">
          <span id="connection-status" class="badge">未连接</span>
          <span class="badge badge-teacher">教师端</span>
        </div>
      </header>

      <main class="stack">
        <section class="teacher-top">
          <section class="card">
            <div class="card-head">
              <h2>学生入口</h2>
              <span id="participant-count" class="badge">0 人在线</span>
            </div>
            <p id="teacher-config-status" class="muted">正在读取服务配置…</p>
            <div class="url-row">
              <code id="student-url">未取得地址</code>
              <button id="copy-button" type="button" disabled>复制</button>
            </div>
            <div class="qr-frame">
              <img id="qr-image" alt="学生入口二维码" hidden />
              <p id="qr-placeholder" class="muted">二维码生成中…</p>
            </div>
            <label class="field compact">
              <span>二维码使用的网卡地址</span>
              <select id="iface-select" disabled>
                <option value="">读取中…</option>
              </select>
            </label>
            <p id="iface-note" class="muted"></p>
          </section>

          <section class="card">
            <h2>课堂状态</h2>
            <dl class="facts">
              <div><dt>协议版本</dt><dd id="protocol-version">—</dd></div>
              <div><dt>课堂状态</dt><dd id="round-status">—</dd></div>
              <div><dt>轮次 ID</dt><dd id="round-id">—</dd></div>
              <div><dt>教师鉴权</dt><dd id="teacher-ws-status">未认证</dd></div>
            </dl>
            <p class="muted">点击拓扑中的会话边，查看 A 实际收到的应用消息。教师连接不计入学生人数。</p>
            <h3>课堂控制</h3>
            <div class="control-row">
              <button id="round-new-button" type="button" class="secondary">新一轮</button>
              <button id="round-end-button" type="button" class="secondary">结束课堂</button>
              <button id="round-start-button" type="button" hidden>开始课堂</button>
              <button id="shutdown-button" type="button" class="danger">退出程序</button>
            </div>
            <p id="control-status" class="muted"></p>
          </section>
        </section>

        <div class="teacher-layout">
          <section class="card graph-card">
            <div class="card-head">
              <div>
                <h2>全班拓扑</h2>
                <p class="muted">圆点是学生，连线是逻辑会话；点击边进入观察。</p>
              </div>
            </div>
            <svg id="topology" viewBox="0 0 1000 1000" role="img" aria-label="班级拓扑与学生会话"></svg>
            <p id="topology-empty" class="muted" hidden>暂无在线学生</p>
          </section>

          <aside class="card observer-card">
            <div class="card-head">
              <div>
                <h2>观察</h2>
                <p id="observer-status" class="muted">选择一条会话边开始观察。</p>
              </div>
              <button id="pause-button" type="button" class="secondary" disabled>暂停观察</button>
            </div>
            <label class="field compact">
              <span>聚焦会话</span>
              <select id="session-select" disabled>
                <option value="">尚无会话</option>
              </select>
            </label>

            <div id="observer-stats" class="stats-grid"></div>
            <p id="observer-truncated" class="error" hidden>当前窗口已淘汰旧记录；累计统计不随淘汰回退。</p>

            <h3>应用消息长度时间轴</h3>
            <p class="muted small">条长按 payload_bytes；不是 IP/TCP 包长。间隔由 A 的单调时钟计算。</p>
            <div id="timeline" class="timeline"></div>

            <h3>观察记录</h3>
            <div id="observer-messages" class="observer-messages"></div>
          </aside>
        </div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/teacher/main.ts"></script>
  </body>
</html>
